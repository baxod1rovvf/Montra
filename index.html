<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montra – Money organizer</title>
<meta name="theme-color" content="#3D4DFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="apple-mobile-web-app-title" content="Montra">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#EEF0FF;--surface:#fff;--ink:#1B1B3A;--muted:#6A6C8F;--line:#d9ddfb;--blue:#3D4DFF;--blue-d:#2230c9;--mint:#12C98B;--mint-d:#0a8f63;--sun:#FFC93C;--sun-d:#c99700;--pink:#FF5C8A;--bar:#3D4DFF;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122B;--surface:#1d1d3f;--ink:#F1F1FF;--muted:#9a9cc8;--line:#2e2e5c;--bar:#8B95FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12122B;--surface:#1d1d3f;--ink:#F1F1FF;--muted:#9a9cc8;--line:#2e2e5c;--bar:#8B95FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
main{max-width:480px;margin:0 auto;padding:18px 16px 130px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:26px;font-weight:800}
.top small{color:var(--muted);display:block;font-size:14px}
.icon-btn{border:2px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:var(--blue);color:#fff;border:0;border-radius:30px;padding:22px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:170px;height:170px;right:-50px;top:-60px}
.hero::after{width:90px;height:90px;right:60px;bottom:-40px;background:rgba(255,201,60,.35)}
.hero>*{position:relative;z-index:1}
.big{font:800 52px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:99px;background:rgba(127,130,200,.25);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sun);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.card .bar>i{background:var(--mint)}
.btn{border:0;font:700 16px 'DM Sans',sans-serif;border-radius:16px;padding:13px 20px;cursor:pointer;background:var(--sun);color:#3a2d00;box-shadow:0 5px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--sun-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}.btn.blue:active{box-shadow:0 0 0 var(--blue-d)}
.btn.mint{background:var(--mint);color:#032e1f;box-shadow:0 5px 0 var(--mint-d)}.btn.mint:active{box-shadow:0 0 0 var(--mint-d)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px;box-shadow:0 4px 0 var(--sun-d)}
.btn.sm.mint{box-shadow:0 4px 0 var(--mint-d)}.btn.sm:active{transform:translateY(4px);box-shadow:0 0 0 #0000}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:20px;padding:14px 12px;color:#1B1B3A}
.stat b{display:block;font:800 28px/1.1 'Bricolage Grotesque',sans-serif}
.stat span{font-size:13px;font-weight:500}
.lvl{width:54px;height:54px;border-radius:18px;background:var(--pink);color:#fff;display:grid;place-items:center;font:800 24px 'Bricolage Grotesque',sans-serif;transform:rotate(-6deg);flex:none}
.muted{color:var(--muted);font-size:14px}
h2{font-size:22px;font-weight:800;margin:6px 0 12px}
.add{display:flex;gap:8px;margin-bottom:14px}
input,select{flex:1;min-width:0;font:500 16px 'DM Sans',sans-serif;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;transition:opacity .3s,transform .3s}
.chk{width:32px;height:32px;border-radius:11px;border:3px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-weight:800;transition:all .2s cubic-bezier(.3,1.6,.5,1);padding:0}
.chk.on{background:var(--mint);border-color:var(--mint);color:#032e1f;transform:scale(1.12) rotate(-6deg)}
.task .t{flex:1;transition:color .2s}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.jar{width:76px;height:110px;border:3px solid var(--line);border-radius:12px 12px 26px 26px;position:relative;overflow:hidden;flex:none;background:var(--bg)}.jar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--mint),#0fa876);transition:height .8s cubic-bezier(.3,1.3,.5,1)}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.cat{border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px "DM Sans",sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer}.cat.on{border-color:var(--ink);transform:scale(1.06)}.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:12px}.sg{border:0;background:none;color:var(--muted);font:700 15px "DM Sans",sans-serif;padding:10px;border-radius:12px;cursor:pointer;transition:all .2s}.sg.in.on{background:var(--mint);color:#032e1f}.sg.out.on{background:var(--pink);color:#fff}.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}.btn.ghost:active{transform:scale(.96)}.btn.red{background:var(--pink);color:#fff;border-color:var(--pink)}.stages{display:flex;gap:6px;margin:10px 0 12px}
.stages i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.stages i.on{background:var(--blue)}.stages.won i.on{background:var(--mint)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:800 20px 'Bricolage Grotesque',sans-serif;color:#1B1B3A;flex:none}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif;color:var(--ink);margin-bottom:4px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(456px,calc(100% - 24px));background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:6px;z-index:20}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr)}
.ind{position:absolute;top:0;bottom:0;left:0;width:25%;border-radius:22px;background:var(--blue);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab{position:relative;z-index:1;border:0;background:none;color:var(--muted);line-height:1.1;text-align:center;font:700 11px 'DM Sans',sans-serif;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tab.on{color:#fff}.tab.on svg{transform:translateY(-2px) scale(1.15)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:all .3s cubic-bezier(.3,1.5,.5,1);z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast .tbtn{margin-left:14px;border:0;background:none;color:inherit;font:700 15px 'DM Sans',sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.p{position:fixed;width:10px;height:14px;border-radius:3px;z-index:40;pointer-events:none;animation:pop .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fl{position:fixed;z-index:40;pointer-events:none;font:800 24px 'Bricolage Grotesque',sans-serif;animation:fl 1s ease-out forwards}
@keyframes fl{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.bump{animation:bump .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{50%{transform:scale(1.06)}}
.icon-btn:disabled{opacity:.35;cursor:default}
.sg.on{background:var(--blue);color:#fff}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700;margin:16px 6px 8px}
.rrow{padding:10px 0;border-top:2px solid var(--line)}.rrow:first-of-type{border-top:0}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mbar b{font:800 20px 'Bricolage Grotesque',sans-serif}
.hb{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin-bottom:14px}.hb:last-child{margin-bottom:0}
.hb .tr{grid-column:1/-1;height:10px;border-radius:4px;background:var(--bg)}.hb .tr i{display:block;height:100%;min-width:4px;border-radius:4px;background:var(--bar)}
.swatch{flex:none;width:48px;height:48px;padding:4px;cursor:pointer}
.qk{font-size:13px;padding:6px 12px}
input[type=date]{min-height:48px}
.gimg{display:block;width:100%;height:170px;object-fit:cover;border-radius:14px;margin-bottom:14px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="toast" id="toast" role="status"></div>
<nav aria-label="Main">

    <button class="tab" data-tab="money"><svg viewBox="0 0 24 24"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg>Income &amp; Expenses</button>
    <button class="tab" data-tab="budgets"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budgets</button>
    <button class="tab" data-tab="goals"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>Goals</button>
  </div>
</nav>
<script>
var TABS=['home','money','budgets','goals'],tab='home',snd=true,selC=0;
var PAL=['#FFC93C','#9AA3FF','#FF8FB0','#12C98B','#C9CCF5','#FF9F5A','#6FD6FF','#B98CFF'];
var DEF=[{n:'Food',c:'#FFC93C'},{n:'Transport',c:'#9AA3FF'},{n:'Fun',c:'#FF8FB0'},{n:'Bills',c:'#12C98B'},{n:'Other',c:'#C9CCF5'}];
var S,CATS,nid=1,undoFn=null,Q='',QF='',QM='',BM=0,cdel=-1,instEvt=null,imgFor=-1,$=function(s){return document.querySelector(s)};
var fmt=function(n){return (n<0?'-':'')+Math.abs(Math.round(n*100)/100).toLocaleString('en-US').replace(/,/g,' ')+(S.cur?' '+S.cur:'')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var txt=function(v,m){return String(v==null?'':v).replace(/[<>&"]/g,'').trim().slice(0,m)};
var lvl=function(){return Math.floor(S.xp/100)+1};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var ac;function beep(f,d,t,v){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(ac.destination);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.1));o.start();o.stop(ac.currentTime+(d||.1))}catch(e){}}
function chime(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,.15,'triangle')},i*65)})}
function coin(){beep(1200,.07,'square',.03);setTimeout(function(){beep(1600,.18,'square',.03)},70)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function toast(m,u){var t=$('#toast');t.textContent=m;if(u){var b=document.createElement('button');b.className='tbtn';b.dataset.act=u;b.textContent='Undo';t.appendChild(b)}t.classList.toggle('act',!!u);t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show','act')},u?5000:2000)}
function confetti(x,y,n){if(reduce)return;var cols=['#3D4DFF','#12C98B','#FFC93C','#FF5C8A','#9AA3FF'];for(var i=0;i<(n||26);i++){var p=document.createElement('i');p.className='p';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cols[i%5];var a=Math.random()*6.283,d=60+Math.random()*110;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+70+'px');p.style.setProperty('--r',Math.random()*720-360+'deg');document.body.appendChild(p);p.addEventListener('animationend',function(){this.remove()})}}
function float(x,y,txt,col){var f=document.createElement('div');f.className='fl';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';f.style.color=col||'#FFC93C';document.body.appendChild(f);f.addEventListener('animationend',function(){f.remove()})}
function center(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function addXP(n){var b=lvl();S.xp=Math.max(0,S.xp+n);if(lvl()>b){chime();confetti(innerWidth/2,innerHeight/3,60);toast('Money level '+lvl()+' unlocked!')}}
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function installCard(){if(standalone())return '';var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
var how=instEvt?'<button class="btn blue" data-act="install">Install Montra</button>':ios?'<div class="muted">Tap the Share button <b>⬆</b> in Safari, then <b>Add to Home Screen</b>.</div>':'<div class="muted">Open the menu in Chrome or Edge and choose <b>Install app</b> or <b>Add to Home screen</b>.</div>';
return '<section class="card"><div class="row" style="align-items:flex-start"><img src="icon-192.png" alt="" width="48" height="48" style="border-radius:12px;flex:none"><div style="flex:1;min-width:0"><b>Get the app</b><div class="muted" style="margin:2px 0 12px">Put Montra on your home screen. It opens like an app and works offline.</div>'+how+'</div></div></section>'}
function shrink(file,cb){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var k=Math.min(1,600/Math.max(im.width,im.height)),cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cb(cv.toDataURL('image/jpeg',.75))};im.onerror=function(){URL.revokeObjectURL(u);cb(null)};im.src=u}
function applyTheme(){var r=document.documentElement;if(S.theme=='auto')r.removeAttribute('data-theme');else r.dataset.theme=S.theme}
/* dates */
var pad=function(n){return (n<10?'0':'')+n};
var iso=function(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fromIso=function(s,keep){if(!/^\d{4}-\d\d-\d\d$/.test(s))return keep||Date.now();if(keep&&iso(keep)==s)return keep;if(s==iso(Date.now()))return Date.now();var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2],12).getTime()};
var mOff=function(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d};
var inMonth=function(ts,off){var m=mOff(off),d=new Date(ts);return d.getMonth()==m.getMonth()&&d.getFullYear()==m.getFullYear()};
var mName=function(d){return d.toLocaleDateString(undefined,{month:'long',year:'numeric'})};
var dt=function(ts){var d=new Date(ts);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()==new Date().getFullYear()?undefined:'numeric'})};
var dayLabel=function(ts){var k=iso(ts);if(k==iso(Date.now()))return 'Today';if(k==iso(Date.now()-864e5))return 'Yesterday';var d=new Date(ts);return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:d.getFullYear()==new Date().getFullYear()?undefined:'numeric'})};
var byTs=function(a,b){return b.ts-a.ts||b.id-a.id};
/* math */
var sum=function(f){return S.L.filter(f).reduce(function(a,e){return a+e.a},0)};
var inc=function(){return sum(function(e){return e.k=='in'})};
var out=function(){return sum(function(e){return e.k=='out'})};
var bal=function(){return S.start+inc()-out()};
var wk=function(k){var t=Date.now()-7*864e5;return sum(function(e){return e.k==k&&e.ts>t&&e.ts<=Date.now()})};
var catSpent=function(i,off){return sum(function(e){return e.k=='out'&&e.c==i&&inMonth(e.ts,off||0)})};
/* repeating entries */
function nextRun(ts,r){var d=new Date(ts);if(r.f=='w'){d.setDate(d.getDate()+7);return d.getTime()}var y=d.getFullYear(),m=d.getMonth()+1;return new Date(y,m,Math.min(r.day,new Date(y,m+1,0).getDate()),12).getTime()}
function runRec(){var k=0,now=Date.now();S.rec.forEach(function(r){var g=0;while(r.next<=now&&g++<400){S.L.push({id:nid++,k:r.k,a:r.a,n:r.n,c:r.c,ts:r.next});r.next=nextRun(r.next,r);k++}});return k}
function plan(g){if(!g.d||g.s>=g.t)return '';var p=g.d.split('-'),end=new Date(+p[0],p[1]-1,+p[2],23,59).getTime(),days=Math.ceil((end-Date.now())/864e5),need=g.t-g.s;
if(days<0)return 'Deadline was '+dt(end);
if(days>=60)return 'Save '+fmt(Math.ceil(need/(days/30.44)))+' a month to reach it by '+dt(end);
return 'Save '+fmt(Math.ceil(need/Math.max(1,days/7)))+' a week to reach it by '+dt(end)}
function coach(){if(!S.L.length)return {e:'👋',t:'Start by adding your salary on the Income &amp; Expenses tab. I will keep track of the rest.'};
if(bal()<0)return {e:'🚨',t:'You have spent more than you earned. Check your latest expenses.'};
var worst=-1,wp=0;CATS.forEach(function(c,i){if(S.lim[i]>0){var p=catSpent(i)/S.lim[i];if(p>wp){wp=p;worst=i}}});
if(wp>1)return {e:'🚨',t:CATS[worst].n+' is over its budget by '+fmt(catSpent(worst)-S.lim[worst])+' this month.'};
if(wp>.8)return {e:'👀',t:CATS[worst].n+' has used '+Math.round(wp*100)+'% of its budget this month.'};
var w=wk('out'),wi=wk('in');return {e:'💡',t:'This week you earned '+fmt(wi)+' and spent '+fmt(w)+(wi>w?'. Saving the difference would fill a goal faster.':'.')}}
/* views */
function head(t,sub){return '<div class="top"><div><h1>'+t+'</h1><small>'+sub+'</small></div><button class="icon-btn" data-act="snd" aria-label="Toggle sound">'+(snd?'🔊':'🔇')+'</button></div>'}

if(cdel!=i){cdel=i;beep(300,.08);render();toast('Its expenses will move to '+CATS[other].n);setTimeout(function(){if(cdel==i){cdel=-1;if(tab=='budgets')render()}},3000);return}
S.L.concat(S.rec).forEach(function(x){if(x.k!='out')return;if(x.c==i)x.c=other;if(x.c>i)x.c--});var gone=CATS.splice(i,1)[0];S.lim.splice(i,1);cdel=-1;selC=0;QF='';beep(250,.12);toast(gone.n+' deleted');render()}
else if(a=='install'){if(!instEvt)return;instEvt.prompt();instEvt.userChoice.then(function(r){instEvt=null;if(r.outcome=='accepted')toast('Montra installed');if(tab=='home')render()})}

else if(a=='gimgdel'){g.img='';beep(300,.08);toast('Photo removed');render()}

else if(a=='gadd'){var v=+f('a').value;if(!(v>0)){toast('Enter an amount to add');return}var was=g.s>=g.t;g.s+=v;coin();buzz();float(c[0],c[1]-10,'+'+fmt(v),'#12C98B');addXP(10);if(!was&&g.s>=g.t){chime();confetti(c[0],c[1],70);toast(g.n+' is full!')}render()}

else if(a=='gdel'){if(!g.confirm){g.confirm=true;beep(300,.08);render();setTimeout(function(){if(S.goals[i]===g&&g.confirm){g.confirm=false;if(tab=='goals')render()}},3000)}else{S.goals.splice(i,1);beep(250,.12);toast('Goal deleted');render()}}
});
